[project]
name = "keelson-sil-echosounder"
version = "0.1.0"
description = "Simulated echo sounder for software-in-the-loop testing: the exact range in, a sounder's depths out"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    # PINNED EXACTLY to the build Slipway runs, so the two agree on every
    # payload, as keelson-sil-gnss pins it.
    "keelson==0.6.0.dev21",
    "eclipse-zenoh>=1.2.1",
]

[project.scripts]
keelson-sil-echosounder = "keelson_sil_echosounder.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keelson_sil_echosounder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
